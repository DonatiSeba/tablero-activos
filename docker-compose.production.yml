# Production override. Invoke only with docker-compose.yml and --env-file /etc/asset-reconciliation/production.env.
# `name` keeps this Compose project, its containers, and its default network isolated from other VPS projects.
name: activos

services:
  postgres:
    # Null removes the inherited development password before the file secret is read.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in the production env file}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in the production env file}
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - app_internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M

  # This one-shot release operation is the only migration owner. Do not put
  # Alembic in the web command or run it concurrently with another release.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_internal
    restart: "no"
    profiles: ["operations"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    # Null removes inherited direct development secrets; file values are authoritative.
    environment:
      DATABASE_URL: null
      SESSION_SECRET: null
      DATABASE_URL_FILE: /run/secrets/database_url
      SESSION_SECRET_FILE: /run/secrets/session_secret
      APP_ENV: production
      IMPORT_STORAGE_PATH: /data/imports
    secrets:
      - database_url
      - session_secret
    networks:
      - app_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 10s

  nginx:
    # Do not publish a host port: Traefik is the sole public listener.
    ports: !reset []
    networks:
      - app_internal
      - n8n_default
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n_default
      traefik.http.routers.activos.rule: Host(`activos.tisico-sa.com`)
      traefik.http.routers.activos.entrypoints: websecure
      traefik.http.routers.activos.tls: "true"
      traefik.http.routers.activos.tls.certresolver: mytlschallenge
      traefik.http.services.activos.loadbalancer.server.port: "80"
    security_opt:
      - no-new-privileges:true
    # Keep the image's standard startup capabilities: Nginx binds port 80
    # before workers drop privileges. Dropping every capability breaks that.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    name: activos_postgres_data
  import_data:
    name: activos_import_data

networks:
  app_internal:
    internal: true
  n8n_default:
    external: true
    name: n8n_default

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE must point to a root-readable secret file}
  database_url:
    file: ${DATABASE_URL_FILE:?DATABASE_URL_FILE must point to a root-readable secret file}
  session_secret:
    file: ${SESSION_SECRET_FILE:?SESSION_SECRET_FILE must point to a root-readable secret file}
